services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - event-service
      - notification-service
#      - payment-service
    environment:
      - USER_SERVICE_URL=http://user-service:4001
      - EVENT_SERVICE_URL=http://event-service:4003
      - NOTIFICATION_SERVICE_URL=http://notification-service:4004
#      - PAYMENT_SERVICE_URL=http://payment-service:4005
    env_file:
      - .env
    volumes:
      - ./services/api-gateway:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 3000 --reload

  user-service:
    build: ./services/user-service
    ports:
      - "4001:4001"
    env_file:
      - .env
    volumes:
      - ./services/user-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 4001 --reload

  event-service:
    build: ./services/event-service
    ports:
      - "4003:4003"
    env_file:
      - .env
    volumes:
      - ./services/event-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 4003 --reload

  notification-service:
    build: ./services/notification-service
    ports:
      - "4004:4004"
    depends_on:
      - user-service
      - event-service
    environment:
      - EVENTOS_URL=http://event-service:4003
      - USUARIOS_URL=http://user-service:4001
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SENDER=${SMTP_SENDER}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
    env_file:
      - .env
    volumes:
      - ./services/notification-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 4004 --reload

