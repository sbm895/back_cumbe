services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - product-service
    environment:
      - USER_SERVICE_URL=http://user-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
    volumes:
      - ./services/api-gateway:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 3000 --reload

  user-service:
    build: ./services/user-service
    ports:
      - "4001:4001"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      - MONGO_DB=users_db
    volumes:
      - ./services/user-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 4001 --reload

  product-service:
    build: ./services/product-service
    ports:
      - "4002:4002"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      - MONGO_DB=products_db
    volumes:
      - ./services/product-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 4002 --reload

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
